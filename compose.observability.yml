services:
  otel-collector:
    image: ${IDELIUM_OTEL_COLLECTOR_IMAGE:?Set a pinned OpenTelemetry Collector image reference}
    profiles:
      - observability
    command:
      - --config=/etc/otelcol/config.yml
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:13133/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: ${IDELIUM_PROMETHEUS_IMAGE:?Set a pinned Prometheus image reference}
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${IDELIUM_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle=false
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:9090/-/healthy || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  grafana:
    image: ${IDELIUM_GRAFANA_IMAGE:?Set a pinned Grafana image reference}
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: ${IDELIUM_GRAFANA_ADMIN_PASSWORD_FILE:?Set the Grafana admin password secret file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  prometheus-data:
  grafana-data:
