stages:
  - validate
  - test

variables:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

.idelium_docker:
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
  before_script:
    - apk add --no-cache bash curl git openssl ripgrep
    - bash -lc '
      set -euo pipefail
      for var_name in IDELIUM_DOCKER_REF IDELIUM_API_REF IDELIUM_WEB_REF IDELIUM_CLI_REF; do
        ref="${!var_name:-}"
        if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "$var_name must be a full 40-character commit SHA." >&2
          exit 2
        fi
      done
      '
    - git clone https://github.com/idelium/idelium-docker.git idelium-docker
    - git -C idelium-docker checkout "$IDELIUM_DOCKER_REF"
    - git clone https://github.com/idelium/idelium-api.git idelium-api
    - git -C idelium-api checkout "$IDELIUM_API_REF"
    - git clone https://github.com/idelium/idelium-web.git idelium-web
    - git -C idelium-web checkout "$IDELIUM_WEB_REF"
    - git clone https://github.com/idelium/idelium-cli.git idelium-cli
    - git -C idelium-cli checkout "$IDELIUM_CLI_REF"

validate-idelium-stack:
  extends: .idelium_docker
  stage: validate
  script:
    - cd idelium-docker
    - ./scripts/validate.sh

run-idelium-cycle:
  extends: .idelium_docker
  stage: test
  needs:
    - validate-idelium-stack
  variables:
    IDELIUM_ENVIRONMENT: "ci"
  script:
    - bash -lc '
      set -euo pipefail
      if [ -z "${IDELIUM_API_KEY:-}" ]; then
        echo "IDELIUM_API_KEY protected CI variable is required." >&2
        exit 2
      fi
      if [ -z "${IDELIUM_PROJECT_ID:-}" ] || [ -z "${IDELIUM_CYCLE_ID:-}" ]; then
        echo "IDELIUM_PROJECT_ID and IDELIUM_CYCLE_ID CI variables are required." >&2
        exit 2
      fi
      if [ -z "${IDELIUM_BASE_URL:-}" ]; then
        echo "IDELIUM_BASE_URL CI variable is required." >&2
        exit 2
      fi
      '
    - cd idelium-docker
    - ./scripts/build-local.sh --no-cache
    - ./start-idelium.sh --demo
    - install -d -m 700 ci
    - install -d -m 755 reports
    - umask 077
    - printf '%s' "$IDELIUM_API_KEY" > ci/idelium-key
    - |
      cat > ci/compose.idelium-runner.yml <<'YAML'
      services:
        idelium-cli-runner:
          volumes:
            - ./ci/idelium-key:/home/idelium/.idelium:ro
            - ./reports:/workspace/reports
      YAML
    - |
      docker compose \
        -f docker-compose.yml \
        -f compose.demo.yml \
        -f compose.runner.yml \
        -f ci/compose.idelium-runner.yml \
        --profile runner \
        run --rm idelium-cli-runner \
        idelium \
          --idProject="$IDELIUM_PROJECT_ID" \
          --idCycle="$IDELIUM_CYCLE_ID" \
          --environment="$IDELIUM_ENVIRONMENT" \
          --ideliumwsBaseurl="$IDELIUM_BASE_URL" \
          --jsonReport=/workspace/reports/idelium-report.json \
          --htmlReport=/workspace/reports/idelium-report.html \
          --markdownReport=/workspace/reports/idelium-report.md \
          --junitReport=/workspace/reports/idelium-junit.xml
  after_script:
    - bash -lc '
      set -euo pipefail
      if [ -d idelium-docker ]; then
        cd idelium-docker
        mkdir -p diagnostics
        docker compose -f docker-compose.yml -f compose.demo.yml ps \
          > diagnostics/compose-ps.txt 2>&1 || true
        docker compose -f docker-compose.yml -f compose.demo.yml logs --no-color --tail=300 \
          | sed -E "s/(IDELIUM_API_KEY=)[^[:space:]]+/\1[redacted]/g" \
          > diagnostics/compose-logs.txt 2>&1 || true
        docker compose \
          -f docker-compose.yml \
          -f compose.demo.yml \
          -f compose.runner.yml \
          --profile runner \
          down --volumes --remove-orphans || true
      fi
      '
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - idelium-docker/reports/
      - idelium-docker/diagnostics/
    reports:
      junit: idelium-docker/reports/idelium-junit.xml
